<!DOCTYPE html>
<!--
  Fuente de assets/og-cover.jpg (1200×630), la imagen que aparece al
  compartir el sitio por WhatsApp, Facebook o X. Para regenerarla:

    chrome --headless=new --hide-scrollbars --window-size=1200,630 ^
      --virtual-time-budget=6000 --screenshot=og-cover.png _dev/og-cover.html

  y convertir el PNG a JPG (ver README → "Imagen para compartir").
  Al cambiarla, sube el ?v= de og:image y twitter:image en index.html:
  WhatsApp y Facebook guardan la imagen vieja en caché.
-->
<html lang="es-MX">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&amp;family=Geist:wght@400;500&amp;family=Geist+Mono:wght@400;500&amp;display=block">
<style>
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; }
  body {
    background:#ECE7DC; color:#16150F;
    font-family:'Geist', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card { position:relative; width:1200px; height:630px; box-sizing:border-box; padding:0 78px; }
  .meta {
    position:absolute; left:78px; right:78px; top:92px;
    display:flex; justify-content:space-between;
    font-family:'Geist Mono', monospace; font-size:17px; font-weight:500;
    letter-spacing:0.2em; text-transform:uppercase; color:#5c5749;
  }
  .rule { position:absolute; left:78px; right:78px; height:1px; background:#16150F; }
  .rule--top { top:132px; }
  .rule--bot { top:498px; }
  .word {
    position:absolute; left:70px; top:206px;
    font-family:'Prata', Georgia, serif; font-size:240px; line-height:1;
    letter-spacing:-0.02em;
  }
  .foot {
    position:absolute; left:78px; right:78px; top:526px;
    display:flex; justify-content:space-between; align-items:baseline; gap:24px;
  }
  .claim { font-size:31px; letter-spacing:-0.01em; }
  .avail { display:flex; align-items:center; gap:12px; font-size:31px; color:#6f6a5c; white-space:nowrap; }
  .avail i { width:14px; height:14px; border-radius:50%; background:#E5541F; display:block; transform:translateY(2px); }
</style>
</head>
<body>
  <div class="card">
    <div class="meta"><span>Diseño y desarrollo web a la medida</span><span>Ciudad de México</span></div>
    <div class="rule rule--top"></div>
    <div class="word">joan</div>
    <div class="rule rule--bot"></div>
    <div class="foot">
      <div class="claim">Tu sitio web profesional, desde 7 días hábiles.</div>
      <div class="avail"><i></i>Disponible</div>
    </div>
  </div>
</body>
</html>
